name: container-readiness

on:
  workflow_dispatch:
  push:
    branches: ['submission/readiness-*']

permissions:
  contents: read

jobs:
  current-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser check dependencies
        working-directory: dashboard
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Build the current source with no developer cache
        run: docker build --pull --no-cache --label "org.opencontainers.image.revision=$GITHUB_SHA" -f Dockerfile.hackathon -t tracex-readiness:ci .
      - name: Entry, report, correction, review, export, assets and restart
        run: python3 -m scripts.docker_readiness --image tracex-readiness:ci --expected-revision "$GITHUB_SHA" --compose --browser --output reports/hackathon/container_validation/ci.json
      - name: Retain actual container result and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-readiness-${{ github.sha }}
          path: reports/hackathon/container_validation/ci.*
          if-no-files-found: warn
